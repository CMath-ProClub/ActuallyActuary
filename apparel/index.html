<style>
/* Security printing, not software: bond paper on a desk, engraved headings,
   a guilloché band. Depth from tight shadows and letterpress. */
:root {
  color-scheme: light;
  --desk:#dcd8cd; --paper:#fffdf8; --edge:#c9c3b4;
  --ink:#141821; --body:#3b434e; --muted:#5f6874;
  --accent:#1f3a5f;
  --hair:rgba(20,24,33,.09); --emboss:rgba(255,255,255,.9); --tab:#efebe0;
  --lift:0 1px 1px rgba(40,34,20,.06), 0 10px 26px -10px rgba(40,34,20,.34);
  --good:#1f5c3d; --warn:#7a5a1e;
}
@media (prefers-color-scheme: dark) { :root {
  color-scheme: dark;
  --desk:#0b0d12; --paper:#161a21; --edge:#2b313b;
  --ink:#f3f1ec; --body:#c0c6cf; --muted:#8c94a0;
  --accent:#9db8dc;
  --hair:rgba(255,255,255,.07); --emboss:rgba(0,0,0,.55); --tab:#11141a;
  --lift:0 1px 1px rgba(0,0,0,.5), 0 12px 30px -10px rgba(0,0,0,.75);
  --good:#63c495; --warn:#d3ac5e;
} }
* { box-sizing:border-box; }
body {
  margin:0; padding:30px 20px 72px; min-height:100vh;
  background:var(--desk); color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  font-variant-numeric:tabular-nums;
}
.shell { max-width:820px; margin:0 auto; }
a { color:var(--accent); text-decoration:none;
  border-bottom:1px solid color-mix(in srgb, var(--accent) 28%, transparent); }
a:hover { border-bottom-color:var(--accent); }

/* ---- top nav ---- */
.nav { display:flex; gap:2px; flex-wrap:wrap; margin-bottom:14px;
  padding:5px; background:var(--tab); border:1px solid var(--edge);
  border-radius:5px; box-shadow:inset 0 1px 0 var(--emboss); }
.nav a { font-size:13px; font-weight:550; color:var(--muted); border:0;
  padding:7px 13px; border-radius:3px; }
.nav a:hover { color:var(--ink); }
.nav a.on { background:var(--paper); color:var(--ink); font-weight:650;
  box-shadow:0 1px 2px rgba(40,34,20,.14); }

/* With JS the raised plate is a single element that slides between tabs, so
   the tab you are leaving hands it to the tab you are arriving at. Without
   JS the .on rule above still paints it and nothing moves. */
.nav.js { position:relative; }
.nav.js a.on { background:transparent; box-shadow:none; }
.nav.js a { position:relative; z-index:1; transition:color .18s ease; }
.nav.js a.lit { color:var(--ink); }
.tabmark { display:none; }
.nav.js .tabmark { display:block; position:absolute; top:0; left:0;
  width:0; height:0; border-radius:3px; z-index:0;
  background:var(--paper); box-shadow:0 1px 2px rgba(40,34,20,.14);
  transition:transform var(--slide,.42s) cubic-bezier(.62,.02,.32,1),
             width var(--slide,.42s) cubic-bezier(.62,.02,.32,1),
             height var(--slide,.42s) cubic-bezier(.62,.02,.32,1); }

/* ---- page-to-page travel ---- */
/* The sections sit side by side on one strip. Moving between two of them
   slides the strip, so the pages in between are genuinely passed rather than
   skipped over. */
.stage { position:relative; }
.slide { will-change:transform; }
.stage.moving { overflow:hidden; }
.stage.moving .slide {
  transition:transform var(--slide,.42s) cubic-bezier(.62,.02,.32,1); }
.flip { position:absolute; inset:0; pointer-events:none;
  transition:transform var(--slide,.42s) cubic-bezier(.62,.02,.32,1); }
.fpanel { position:absolute; top:0; width:100%; }
.fsheet { background:var(--paper); border:1px solid var(--edge);
  box-shadow:var(--lift); padding:40px 46px 38px; min-height:340px; }
.fsheet h1 { margin:0; }
.fsheet .sub { margin-top:7px; max-width:60ch; }
.fsheet .dblrule { margin-top:26px; }
.enter .slide { animation:settle .34s cubic-bezier(.22,.7,.3,1) both; }
@keyframes settle {
  from { opacity:0; transform:translateY(8px) scale(.994); }
  to   { opacity:1; transform:none; } }

@media (prefers-reduced-motion: reduce) {
  .nav.js .tabmark, .stage.moving .slide, .flip { transition:none; }
  .enter .slide { animation:none; }
}


/* ---- sheet ---- */
.sheetwrap { position:relative; }
.sheet { background:var(--paper); border:1px solid var(--edge);
  box-shadow:var(--lift); padding:40px 46px 38px; }
.sheet::before { content:""; position:absolute; inset:9px;
  border:1px solid var(--hair); pointer-events:none; }
.sheet.inner { padding-top:26px; }

.crumbs { font-size:12.5px; color:var(--muted); margin-bottom:14px; }
.crumbs .sep { color:var(--edge); margin:0 5px; }
.crumbs a { border:0; }

h1 { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:40px; line-height:1.08; letter-spacing:-0.015em; font-weight:600;
  color:var(--ink); margin:0 0 9px; text-shadow:0 1px 0 var(--emboss); }
.inner h1 { font-size:31px; }
.sub { font-size:15.5px; color:var(--ink); margin:0; font-weight:500; }
.sub .thin { color:var(--muted); font-weight:400; }
.tagline { margin:18px 0 0; font-size:16px; max-width:58ch; }
.inner .tagline { margin-top:8px; font-size:15px; color:var(--muted); }
.links { margin:22px 0 0; font-size:13.5px; color:var(--muted); line-height:2.05; }
.links .sep { color:var(--edge); margin:0 3px; }
.guilloche { display:block; width:100%; height:38px; margin:24px 0 0; opacity:.34; }
.guilloche path { fill:none; stroke:var(--accent); stroke-width:.7;
  vector-effect:non-scaling-stroke; }
.dblrule { border:0; border-top:1px solid var(--edge);
  border-bottom:1px solid var(--edge); height:3px; margin:20px 0 0; }

/* ---- home ---- */
/* The seal: an engine-turned rosette, sunk into the paper behind the name. */
.rosette { position:absolute; top:18px; right:22px; width:132px; height:132px;
  opacity:.20; pointer-events:none; }
.rosette path { fill:none; stroke:var(--accent); stroke-width:.55;
  vector-effect:non-scaling-stroke; }

/* Numbers, struck into the page. Actuaries lead with figures; so does this. */
.numbers { display:grid; grid-template-columns:repeat(3,1fr);
  gap:1px; background:var(--edge); border:1px solid var(--edge); border-radius:4px;
  margin-top:28px; overflow:hidden; box-shadow:inset 0 1px 0 var(--emboss); }
.num { background:var(--paper); padding:15px 14px 13px; text-align:center; }
.numv { display:block;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:29px; font-weight:600; color:var(--ink); letter-spacing:-0.02em;
  line-height:1.05; text-shadow:0 1px 0 var(--emboss); }
.numk { display:block; font-size:11.5px; color:var(--muted); margin-top:5px;
  line-height:1.35; }
@media (max-width:560px) { .numbers { grid-template-columns:repeat(2,1fr); } }
/* The seal sits in the margin beside the name. On a phone there is no margin
   to sit in, so it would print straight through the subtitle. */
@media (max-width:700px) { .rosette { display:none; } }

.nowlist { border-top:1px solid var(--hair); }
.nowrow { display:flex; gap:20px; padding:14px 0;
  border-bottom:1px solid var(--hair); align-items:baseline; }
.nowk { min-width:92px; color:var(--accent); font-size:12.5px; font-weight:650;
  text-transform:uppercase; letter-spacing:.09em; }
.nowv { max-width:60ch; }
.nowlist.wide .nowk { min-width:230px; }

/* ---- FAQ ---- */
/* Native <details>, so it opens with JS off and prints open when printed.
   Each row is a card that lifts a little once it is open, the way the sheet
   itself sits above the desk. */
.faqlist { margin-top:18px; border-top:1px solid var(--hair); }
.faq { border-bottom:1px solid var(--hair); }
.faq summary { list-style:none; cursor:pointer; position:relative;
  padding:15px 40px 15px 0; font-size:16px; font-weight:600; color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  text-shadow:0 1px 0 var(--emboss); transition:color .14s ease; }
.faq summary::-webkit-details-marker { display:none; }
.faq summary:hover { color:var(--accent); }
.faq summary:focus-visible { outline:2px solid var(--accent);
  outline-offset:3px; border-radius:2px; }

/* The marker is a ruled square that loses its cross-bar when the answer is
   open - a plus becoming a minus, drawn rather than typed. */
.faq summary::before, .faq summary::after { content:""; position:absolute;
  right:11px; top:50%; background:var(--muted); transition:opacity .18s ease,
  transform .18s ease; }
.faq summary::before { width:11px; height:1.5px; margin-top:-0.75px;
  right:6px; }
.faq summary::after { width:1.5px; height:11px; margin-top:-5.5px;
  right:10.75px; }
.faq[open] summary { color:var(--accent); }
.faq[open] summary::after { opacity:0; transform:rotate(90deg); }
.faq[open] summary::before { background:var(--accent); }

.faqa { padding:0 8px 20px 0; max-width:66ch;
  animation:unfold .26s cubic-bezier(.22,.7,.3,1) both; }
.faqa p { margin:0 0 11px; color:var(--body); }

/* Figures get a ruled table rather than a paragraph of numbers. It scrolls
   inside its own box so a phone never gets a sideways page. */
.tablewrap { overflow-x:auto; margin:4px 0 12px;
  border:1px solid var(--edge); border-radius:4px;
  box-shadow:inset 0 1px 0 var(--emboss); }
.paytable { border-collapse:collapse; width:100%; min-width:430px;
  font-size:13.5px; }
.paytable th, .paytable td { text-align:right; padding:9px 13px;
  border-bottom:1px solid var(--hair); white-space:nowrap; }
.paytable thead th { font-size:10.5px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--muted); font-weight:650;
  background:var(--tab); border-bottom:1px solid var(--edge); }
.paytable tbody th { text-align:left; font-weight:600; color:var(--ink);
  white-space:normal; }
.paytable td { color:var(--body); font-variant-numeric:tabular-nums; }
.paytable tbody tr:last-child th,
.paytable tbody tr:last-child td { border-bottom:0; }
.paytable tbody tr:hover th, .paytable tbody tr:hover td {
  background:var(--tab); }
.tnote { font-size:12.5px; color:var(--muted); margin:0 0 12px;
  max-width:62ch; }
/* On a phone the ceiling column is the one worth seeing, and it is the one
   that falls off the right edge. Tighten everything until all four fit. */
@media (max-width:620px) {
  .paytable { min-width:0; font-size:11.5px; }
  .paytable th, .paytable td { padding:7px 6px; }
  .paytable thead th { font-size:9.5px; letter-spacing:.05em;
    white-space:normal; }
}
.faqa p:last-child { margin-bottom:0; }
@keyframes unfold {
  from { opacity:0; transform:translateY(-5px); }
  to   { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .faqa { animation:none; } }
@media print { .faq summary::before, .faq summary::after { display:none; } }
@media (max-width:620px) {
  .nowrow { display:block; }
  .nowlist.wide .nowk, .nowk { min-width:0; margin-bottom:4px; }
}

/* The featured project: a card raised off the sheet it sits on. */
.feature { display:block; margin-top:30px; padding:22px 24px; border-radius:5px;
  border:1px solid var(--edge); background:var(--tab); position:relative;
  box-shadow:inset 0 1px 0 var(--emboss), 0 2px 3px rgba(40,34,20,.07),

  transition:transform .14s ease, box-shadow .18s ease; }
.feature:hover { transform:translateY(-3px);
  box-shadow:inset 0 1px 0 var(--emboss), 0 4px 6px rgba(40,34,20,.09),

.ftag { display:block; font-size:10.5px; text-transform:uppercase;

.fname { display:block; margin-top:7px;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:22px; font-weight:600; color:var(--ink); letter-spacing:-0.015em;
  text-shadow:0 1px 0 var(--emboss); }
.fblurb { display:block; margin-top:8px; color:var(--body); max-width:56ch; }
.fgo { display:block; margin-top:12px; font-size:13.5px; font-weight:600;
  color:var(--accent); }

/* Voice. Set larger and looser than body copy, because it is the one place
   the page is allowed to sound like a person rather than a document. */
.beliefs { list-style:none; margin:0; padding:0; }
.beliefs li { position:relative; padding:11px 0 11px 30px; max-width:60ch;
  font-size:16.5px; line-height:1.5; color:var(--ink);

  border-bottom:1px solid var(--hair); }
.beliefs li:last-child { border-bottom:0; }
.beliefs li::before { content:"“"; position:absolute; left:1px; top:21px;

.sechead { font-size:11.5px; text-transform:uppercase; letter-spacing:.13em;

.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));

.card:hover { transform:translateY(-2px); box-shadow:var(--lift);
  border-color:var(--accent); }
.cardtitle { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;

.cardlead { font-size:13px; color:var(--muted); line-height:1.5; }
.cardgo { font-size:12.5px; color:var(--accent); margin-top:4px; font-weight:550; }

/* ---- entries ---- */
.lead { font-size:16px; margin:0 0 6px; max-width:62ch; }
.entry { padding:22px 0; border-bottom:1px solid var(--hair); }
.entry:last-child { border-bottom:0; padding-bottom:2px; }
.entry-head { display:flex; gap:18px; align-items:baseline;
  justify-content:space-between; flex-wrap:wrap; }
.strong { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;

.org { color:var(--body); font-size:14.5px; }
.org::before { content:"·"; color:var(--edge); margin:0 7px; }
.when { color:var(--muted); font-size:13px; white-space:nowrap; }
.where { color:var(--muted); font-size:13px; margin-top:2px; }

  box-shadow:inset 0 1px 0 var(--emboss); }

/* ---- exams ---- */
.examrow { display:flex; gap:16px; align-items:flex-start; padding:14px 0;
  border-bottom:1px solid var(--hair); }
.examcode { min-width:92px; font-weight:700; color:var(--ink); font-size:14.5px; }

.examnote { color:var(--muted); font-size:13px; margin-top:2px; max-width:52ch; }
.pill { font-size:11.5px; font-weight:650; padding:3px 11px; border-radius:999px;

.pill.passed { color:var(--good); border-color:currentColor; }

.skillrow { display:flex; gap:20px; padding:13px 0;

.skillrow:last-child { border-bottom:0; }
.skilllabel { min-width:92px; color:var(--muted); font-size:12.5px;
  text-transform:uppercase; letter-spacing:.09em; }
.tags { display:flex; flex-wrap:wrap; gap:7px; }
.tag { font-size:13px; color:var(--body); border:1px solid var(--edge);
  border-radius:3px; padding:3px 10px; background:var(--tab);
  box-shadow:inset 0 1px 0 var(--emboss); }

.pending { padding:30px 0 6px; }
.pending p { margin:0 0 8px; }
.muted { color:var(--muted); }

footer { margin:20px 0 0; color:var(--muted); font-size:13px;
  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:0 6px; }

@media (max-width:640px) {
  body { padding:14px 12px 48px; }
  .sheet { padding:26px 20px 24px; }
  h1 { font-size:30px; } .inner h1 { font-size:25px; }
  .nav a { padding:6px 10px; font-size:12.5px; }
}
@media print {
  body { background:#fff; padding:0; }
  .sheet { box-shadow:none; border:0; padding:0; }
  .sheet::before, .guilloche, .nav, a.demo, .cards { display:none; }
  a { border:0; color:#000; }
}

/* Moving between sections slides one strip of pages sideways, so going from
   Home to Resume genuinely passes Projects instead of cutting to it. The tab
   plate travels with it and lights each tab it crosses.

   Pages live on separate subdomains, so there is no shared document to
   animate across. The outgoing page plays the whole journey and ends holding
   a panel that looks like the destination; the arriving page recognises where
   it came from via document.referrer and settles in from there. The seam
   lands while the destination panel is on screen. */
(function () {
  var nav = document.querySelector('.nav');
  if (!nav || !window.requestAnimationFrame) return;
  var tabs = [].slice.call(nav.querySelectorAll('a.tab'));
  var mark = nav.querySelector('.tabmark');
  if (!tabs.length || !mark) return;

  var here = parseInt(nav.getAttribute('data-here'), 10) || 0;
  var stage = document.querySelector('.stage');
  var slide = stage && stage.querySelector('.slide');
  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  nav.classList.add('js');

  function place(i, animate) {
    var t = tabs[i];
    if (!t) return;
    var cs = getComputedStyle(nav);
    var bl = parseFloat(cs.borderLeftWidth) || 0;
    var bt = parseFloat(cs.borderTopWidth) || 0;
    if (!animate) mark.style.transition = 'none';
    mark.style.width = t.offsetWidth + 'px';
    mark.style.height = t.offsetHeight + 'px';
    mark.style.transform = 'translate(' + (t.offsetLeft - bl) + 'px,'
      + (t.offsetTop - bt) + 'px)';
    if (!animate) { void mark.offsetWidth; mark.style.transition = ''; }
  }

  place(here, false);
  window.addEventListener('resize', function () { place(here, false); });

  /* Match a URL to a tab by host AND path, so this works whether the sections
     are subdomains or plain folders. */
  function indexOf(url) {
    if (!url) return -1;
    var a;
    try { a = new URL(url, location.href); } catch (e) { return -1; }
    var ap = a.pathname.replace(/\/+$/, '');
    for (var i = 0; i < tabs.length; i++) {
      var b = new URL(tabs[i].getAttribute('href'), location.href);
      if (b.host === a.host && b.pathname.replace(/\/+$/, '') === ap) return i;
    }
    return -1;
  }

  function travel(to, href) {
    var steps = Math.abs(to - here);
    var dir = to > here ? 1 : -1;
    /* Long jumps speed up per step, or crossing seven tabs would crawl. */
    var dur = Math.min(880, Math.max(320, steps * (steps > 3 ? 155 : 215)));
    stage.style.setProperty('--slide', dur + 'ms');
    nav.style.setProperty('--slide', dur + 'ms');

    var strip = document.createElement('div');
    strip.className = 'flip';
    /* Draw the ghosts where the reader is actually looking, not at the top of
       a page they may have scrolled halfway down. */
    var top = Math.max(0, (window.pageYOffset || 0) - stage.offsetTop);
    for (var k = 1; k <= steps; k++) {
      var t = tabs[here + dir * k];
      var p = document.createElement('div');
      p.className = 'fpanel';
      p.style.left = (dir * k * 100) + '%';
      p.style.top = top + 'px';
      p.innerHTML = '<div class="fsheet"><h1></h1><p class="sub"></p>'
        + '<hr class="dblrule"></div>';
      p.querySelector('h1').textContent =
        t.getAttribute('data-t') || t.textContent;
      p.querySelector('.sub').textContent = t.getAttribute('data-l') || '';
      strip.appendChild(p);
    }
    stage.style.height = stage.offsetHeight + 'px';
    stage.appendChild(strip);
    stage.classList.add('moving');

    for (var j = 1; j < steps; j++) {
      (function (tab, at, hold) {
        setTimeout(function () {
          tab.classList.add('lit');
          setTimeout(function () { tab.classList.remove('lit'); }, hold);
        }, at);
      })(tabs[here + dir * j], dur * (j - 0.5) / steps, dur / steps);
    }

    tabs[here].classList.remove('on');
    tabs[to].classList.add('on');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var x = 'translateX(' + (-dir * steps * 100) + '%)';
        slide.style.transform = x;
        strip.style.transform = x;
        place(to, true);
      });
    });
    setTimeout(function () { location.href = href; }, dur);
  }

  nav.addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest ? e.target.closest('a.tab') : null;
    if (!a) return;
    var to = parseInt(a.getAttribute('data-i'), 10);
    if (to === here) { e.preventDefault(); return; }
    if (reduce || !stage || !slide) return;
    e.preventDefault();
    travel(to, a.href);
  });

  /* Arriving. Pick the motion up where the previous page left it. */
  var from = indexOf(document.referrer);
  if (!reduce && from !== -1 && from !== here) {
    nav.style.setProperty('--slide', '360ms');
    document.body.classList.add('enter');
    place(from, false);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { place(here, true); });
    });
  }

  /* Coming back through history restores the mid-slide state; undo it. */
  window.addEventListener('pageshow', function (ev) {
    if (!ev.persisted || !stage) return;
    var old = stage.querySelector('.flip');
    if (old) old.parentNode.removeChild(old);
    stage.classList.remove('moving');
    stage.style.height = '';
    if (slide) slide.style.transform = '';
    place(here, false);
  });
})();
</script>
</body></html>
