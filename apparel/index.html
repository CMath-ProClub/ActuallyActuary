<style>
/* Security printing, not software: bond paper on a desk, engraved headings,
   a guilloché band. Depth from tight shadows and letterpress. */
:root {
  color-scheme: light;
  --desk:#dcd8cd; --paper:#fffdf8; --edge:#c9c3b4;
  --ink:#141821; --body:#3b434e; --muted:#5f6874;
  --accent:#1f3a5f;
  --hair:rgba(20,24,33,.09); --emboss:rgba(255,255,255,.9); --tab:#efebe0;
  --lift:0 1px 1px rgba(40,34,20,.06), 0 10px 26px -10px rgba(40,34,20,.34);
  --good:#1f5c3d; --warn:#7a5a1e;
}
@media (prefers-color-scheme: dark) { :root {
  color-scheme: dark;
  --desk:#0b0d12; --paper:#161a21; --edge:#2b313b;
  --ink:#f3f1ec; --body:#c0c6cf; --muted:#8c94a0;
  --accent:#9db8dc;
  --hair:rgba(255,255,255,.07); --emboss:rgba(0,0,0,.55); --tab:#11141a;
  --lift:0 1px 1px rgba(0,0,0,.5), 0 12px 30px -10px rgba(0,0,0,.75);
  --good:#63c495; --warn:#d3ac5e;
} }
* { box-sizing:border-box; }
body {
  margin:0; padding:30px 20px 72px; min-height:100vh;
  background:var(--desk); color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15.5px; line-height:1.62; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.shell { max-width:820px; margin:0 auto; }
a { color:var(--accent); text-decoration:none;
  border-bottom:1px solid color-mix(in srgb, var(--accent) 28%, transparent); }
a:hover { border-bottom-color:var(--accent); }

/* ---- top nav ---- */
.nav { display:flex; gap:2px; flex-wrap:wrap; margin-bottom:14px;
  padding:5px; background:var(--tab); border:1px solid var(--edge);
  border-radius:5px; box-shadow:inset 0 1px 0 var(--emboss); }
.nav a { font-size:13px; font-weight:550; color:var(--muted); border:0;
  padding:7px 13px; border-radius:3px; }
.nav a:hover { color:var(--ink); background:var(--paper); }
.nav a.on { background:var(--paper); color:var(--ink); font-weight:650;
  box-shadow:0 1px 2px rgba(40,34,20,.14); }

/* ---- sheet ---- */
.sheetwrap { position:relative; }
.sheet { background:var(--paper); border:1px solid var(--edge);
  box-shadow:var(--lift); padding:40px 46px 38px; }
.sheet::before { content:""; position:absolute; inset:9px;
  border:1px solid var(--hair); pointer-events:none; }
.sheet.inner { padding-top:26px; }

.crumbs { font-size:12.5px; color:var(--muted); margin-bottom:14px; }
.crumbs .sep { color:var(--edge); margin:0 5px; }
.crumbs a { border:0; }

h1 { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:40px; line-height:1.08; letter-spacing:-0.015em; font-weight:600;
  color:var(--ink); margin:0 0 9px; text-shadow:0 1px 0 var(--emboss); }
.inner h1 { font-size:31px; }
.sub { font-size:15.5px; color:var(--ink); margin:0; font-weight:500; }
.sub .thin { color:var(--muted); font-weight:400; }
.tagline { margin:18px 0 0; font-size:16px; max-width:58ch; }
.inner .tagline { margin-top:8px; font-size:15px; color:var(--muted); }
.links { margin:22px 0 0; font-size:13.5px; color:var(--muted); line-height:2.05; }
.links .sep { color:var(--edge); margin:0 3px; }
.guilloche { display:block; width:100%; height:38px; margin:24px 0 0; opacity:.34; }
.guilloche path { fill:none; stroke:var(--accent); stroke-width:.7;
  vector-effect:non-scaling-stroke; }
.dblrule { border:0; border-top:1px solid var(--edge);
  border-bottom:1px solid var(--edge); height:3px; margin:20px 0 0; }

/* ---- home ---- */
.highlights { margin-top:26px; border-top:1px solid var(--hair); }
.hl { display:flex; gap:20px; padding:13px 0; border-bottom:1px solid var(--hair);
  align-items:baseline; }
.hlk { min-width:88px; color:var(--muted); font-size:12.5px;
  text-transform:uppercase; letter-spacing:.09em; }
.hlv { max-width:60ch; }
.sechead { font-size:11.5px; text-transform:uppercase; letter-spacing:.13em;
  color:var(--muted); font-weight:650; margin:30px 0 12px;
  padding-bottom:8px; border-bottom:1px solid var(--edge); }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:10px; }
.card { display:flex; flex-direction:column; gap:5px; border:1px solid var(--edge);
  border-radius:4px; padding:15px 17px; background:var(--tab); border-bottom-width:1px;
  box-shadow:inset 0 1px 0 var(--emboss); transition:transform .12s, box-shadow .15s; }
.card:hover { transform:translateY(-2px); box-shadow:var(--lift);
  border-color:var(--accent); }
.cardtitle { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:17px; color:var(--ink); font-weight:600; }
.cardlead { font-size:13px; color:var(--muted); line-height:1.5; }
.cardgo { font-size:12.5px; color:var(--accent); margin-top:4px; font-weight:550; }

/* ---- entries ---- */
.lead { font-size:16px; margin:0 0 6px; max-width:62ch; }
.entry { padding:22px 0; border-bottom:1px solid var(--hair); }
.entry:last-child { border-bottom:0; padding-bottom:2px; }
.entry-head { display:flex; gap:18px; align-items:baseline;
  justify-content:space-between; flex-wrap:wrap; }
.strong { font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:18px; color:var(--ink); font-weight:600; letter-spacing:-0.01em;
  text-shadow:0 1px 0 var(--emboss); }
.org { color:var(--body); font-size:14.5px; }
.org::before { content:"·"; color:var(--edge); margin:0 7px; }
.when { color:var(--muted); font-size:13px; white-space:nowrap; }
.where { color:var(--muted); font-size:13px; margin-top:2px; }
.blurb { margin:10px 0 0; max-width:62ch; }
.prose p { margin:10px 0 0; max-width:62ch; }
ul.notes { margin:10px 0 0; padding-left:18px; }
ul.notes li { margin:5px 0; max-width:62ch; }
ul.notes li::marker { color:var(--edge); }
a.demo { display:inline-block; margin-top:14px; font-size:13.5px; font-weight:550;
  border:1px solid var(--edge); border-radius:3px; padding:8px 15px;
  color:var(--accent); background:var(--tab);
  box-shadow:inset 0 1px 0 var(--emboss); }
a.demo:hover { border-color:var(--accent); }

/* ---- exams ---- */
.examrow { display:flex; gap:16px; align-items:flex-start; padding:14px 0;
  border-bottom:1px solid var(--hair); }
.examcode { min-width:92px; font-weight:700; color:var(--ink); font-size:14.5px; }
.examname { flex:1; color:var(--ink); font-size:14.5px; }
.examnote { color:var(--muted); font-size:13px; margin-top:2px; max-width:52ch; }
.pill { font-size:11.5px; font-weight:650; padding:3px 11px; border-radius:999px;
  border:1px solid var(--edge); color:var(--muted); background:var(--tab);
  white-space:nowrap; }
.pill.passed { color:var(--good); border-color:currentColor; }
.pill.scheduled, .pill.studying { color:var(--warn); border-color:currentColor; }

/* ---- skills ---- */
.skillrow { display:flex; gap:20px; padding:13px 0;
  border-bottom:1px solid var(--hair); align-items:baseline; }
.skillrow:last-child { border-bottom:0; }
.skilllabel { min-width:92px; color:var(--muted); font-size:12.5px;
  text-transform:uppercase; letter-spacing:.09em; }
.tags { display:flex; flex-wrap:wrap; gap:7px; }
.tag { font-size:13px; color:var(--body); border:1px solid var(--edge);
  border-radius:3px; padding:3px 10px; background:var(--tab);
  box-shadow:inset 0 1px 0 var(--emboss); }

.pending { padding:30px 0 6px; }
.pending p { margin:0 0 8px; }
.muted { color:var(--muted); }

footer { margin:20px 0 0; color:var(--muted); font-size:13px;
  display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:0 6px; }

@media (max-width:640px) {
  body { padding:14px 12px 48px; }
  .sheet { padding:26px 20px 24px; }
  h1 { font-size:30px; } .inner h1 { font-size:25px; }
  .nav a { padding:6px 10px; font-size:12.5px; }
}
@media print {
  body { background:#fff; padding:0; }
  .sheet { box-shadow:none; border:0; padding:0; }
  .sheet::before, .guilloche, .nav, a.demo, .cards { display:none; }
  a { border:0; color:#000; }
}
</style></head>

  <p class="sub"></p>

  <div class="links"></div>
  
  <hr class="dblrule">
