<main id="view" tabindex="-1">
  <noscript>
    <section class="card">
      <h1>This one needs JavaScript</h1>
      <p>The whole tool runs in your browser: it generates the problems, grades
      them, and keeps your history locally. There is no server doing the work,
      so with scripting off there is nothing to show.</p>
    </section>
  </noscript>
  <section class="card" id="booting">
    <p class="muted">Loading...</p>
  </section>
</main>

<footer>
  <p>Built for two people. Your work stays in this browser unless you turn on
  sync, and the optional model runs on your own machine.</p>
</footer>

<script type="module">
import { boot } from './app.js';
const el = document.getElementById('booting');
try {
  boot();
  if (el) el.remove();
} catch (err) {
  console.error(err);
  if (el) {
    el.innerHTML = '<h1>The app did not start</h1>'
      + '<p>Something went wrong loading it. The browser console has the detail, '
      + 'and nothing you have saved is affected.</p>'
      + '<pre class="code"></pre>';
    el.querySelector('pre').textContent = String(err && err.stack || err);
  }
}
</script>
